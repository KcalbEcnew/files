<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fresh.</title>
  <style>
    :root {
      --primary:#aaffa0;
      --primary-hover: #B8E788;
      --bg: #fafafa;
      --card-bg: #ffffff;
      --border: #dbdbdb;
      --text: #262626;
      --text-muted: #8e8e8e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding-top: 70px;
      padding-bottom: 40px;
    }

    /* Top Navigation Bar */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 100;
    }

    .brand {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--primary);
    }

    .nav-actions button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      margin-left: 8px;
    }

    .nav-actions button.secondary {
      background-color: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* Main Feed Layout */
    .feed-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 10px;
    }

    /* Instagram-Style Post Card */
    .post-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .post-header {
      display: flex;
      align-items: center;
      padding: 12px 16px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #eee;
      margin-right: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #666;
    }

    .post-header-info {
      flex: 1;
    }

    .author-name {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .remix-tag {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .post-image {
      width: 100%;
      height: 350px;
      object-fit: cover;
      background-color: #f0f0f0;
    }

    .post-actions {
      padding: 10px 16px;
      display: flex;
      gap: 16px;
    }

    .action-btn {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .action-btn.liked {
      color: var(--primary);
    }

    .post-body {
      padding: 0 16px 16px 16px;
    }

    .post-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .recipe-details {
      background: #f9f9f9;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      margin-top: 8px;
    }

    .recipe-details h4 {
      margin-bottom: 4px;
      color: #444;
    }

    /* Modals & Slide-out Drawers */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: var(--card-bg);
      width: 90%;
      max-width: 500px;
      border-radius: 12px;
      padding: 24px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
    }

    /* Cook List Side Drawer */
    .drawer {
      position: fixed;
      top: 0; right: -380px;
      width: 350px;
      height: 100%;
      background: var(--card-bg);
      border-left: 1px solid var(--border);
      box-shadow: -2px 0 10px rgba(0,0,0,0.1);
      transition: right 0.3s ease;
      z-index: 150;
      padding: 20px;
      overflow-y: auto;
    }

    .drawer.open {
      right: 0;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .list-group {
      background: #f9f9f9;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .list-title {
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 8px;
      border-bottom: 1px solid #eee;
      padding-bottom: 4px;
    }

    .cook-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 0.9rem;
    }
    #notice:not(:empty) { position:fixed; bottom:12px; left:5%; width:90%; padding:12px; background:#fff; border:1px solid var(--border); z-index:300; }
  </style>
</head>

// Example 1: POST "/register"
async function exampleRegister(username, password, bio) {
  try {
    const response = await fetch(BASE_URL + ("/register"), {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({username: username, password: password, bio: bio})
    });
    const data = await response.json();
    if (response.ok) {
      console.log(data);
      return data;
    } else {
      alert(data.error || "Please log in first.");
      return null;
    }
  } catch (error) {
    alert("Could not connect to the server.");
    return null;
  }
}

// 2. STUDENT EXERCISES — called by the real forms and buttons.
// Use document.getElementById("inputId").value to read a field.
// Write fetch directly, as in the examples. Always check response.ok.
// For protected requests, a 401 should resetSession() and ask the user to log in.
// Catch network failures. Do not update the UI as if a failed request succeeded.

async function handleRegister(event) {
  event.preventDefault();
  
  try {
    // 1. Get input values
    const registername = document.getElementById("registerName").value.trim();
    const registerpassword = document.getElementById("registerPassword").value.trim();
    const registerbio = document.getElementById("registerBio").value.trim();

    // 2. Validate inputs
    if (!registername) {
      alert("Name cannot be empty.");
      return null;
    }
    if (!registerpassword) {
      alert("Password cannot be empty.");
      return null;
    } 

    // 3. Send the POST request
    const response = await fetch(BASE_URL + "/register", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: registername, password: registerpassword, bio: registerbio })
    });
    
    const data = await response.json();
    
    if (response.ok) {
      console.log(data);
      // Optional from Exercise instructions: clear password, switch modals
      document.getElementById("registerPassword").value = "";
      return data;
    } else {
      // Handles duplicate username (409) or other server-side errors returned in JSON
      alert(data.error || "Please log in first");
      return null;
    } 
  } catch (error) {
    // This will now correctly catch actual network connection drops or fetch failures
    console.error(error);
    alert("Could not connect to the server");
    return null;
  }
}

// 3. PROVIDED UI HELPERS — rendering and dialogs only; no API calls.
function notify(message) { document.getElementById('notice').textContent = message; }
function resetSession() {
  currentUser = null; posts = []; cookLists = []; 
  document.getElementById('userBadge').textContent = 'Not logged in';
  document.getElementById('authButton').textContent = 'Log in';
  document.getElementById('authButton').onclick = () => openModal('loginModal');
  document.getElementById('feed').textContent = 'Log in to view recipes.';
  document.getElementById('cookListsContainer').textContent = 'Log in to view your cook lists.';
}
function setUser(data) {
  currentUser = data; 
  document.getElementById('userBadge').textContent = data.username;
  document.getElementById('authButton').textContent = 'Log out'; document.getElementById('authButton').onclick = handleLogout;
}




function button(parent,label,handler) {
  const b=document.createElement('button'); b.className='action-btn'; b.textContent=label; b.onclick=handler; parent.appendChild(b);
}
function text(parent,tag,value,className='') {
  const node=document.createElement(tag); node.className=className; node.textContent=value; parent.appendChild(node); return node;
}
function renderFeed() {
  const feed=document.getElementById('feed'); feed.replaceChildren();
  if (!posts.length) { feed.textContent='No recipes found. Create one or change the search.'; return; }
  for (const post of posts) {
    const card=document.createElement('article'); card.className='post-card';
    const body=text(card,'div','','post-body');
    text(body,'h2',post.name,'post-title'); text(body,'small',`Recipe ID: ${post.recipe_id}`); text(body,'p',post.description,'recipe-details');
    const actions=text(card,'div','','post-actions');
    button(actions,'Add to List',()=>openAddToListModal(post.recipe_id));
    if (Number(post.user_id)===Number(currentUser.user_id)) button(actions,'Delete',()=>deleteRecipe(post.recipe_id));
    feed.appendChild(card);
  }
}
function renderDrawerLists() {
  const container=document.getElementById('cookListsContainer'); container.replaceChildren();
  if (!cookLists.length) { container.textContent='No cook lists found.'; return; }
  for (const list of cookLists) {
    const group=text(container,'div','','list-group'); text(group,'h3',list.name,'list-title'); text(group,'p',list.description);
    button(group,'Delete list',()=>deleteList(list.cooklist_id));
    if (!list.recipes.length) text(group,'p','No saved recipes.');
    for (const recipe of list.recipes) {
      const item=text(group,'div','','cook-item'); text(item,'span',recipe.name);
      button(item,'Remove',()=>removeFromList(list.cooklist_id,recipe.recipe_id));
    }
  }
}

function openModal(id) {
  if (!currentUser && !['loginModal','registerModal'].includes(id)) id='loginModal';
  document.getElementById(id).style.display='flex';
}
function closeModal(id) { document.getElementById(id).style.display='none'; }
function toggleDrawer() {
  if (!currentUser) return openModal('loginModal');
  document.getElementById('cookDrawer').classList.toggle('open'); loadLists();
}
document.querySelectorAll('.modal').forEach(modal=>modal.addEventListener('click',event=>{if(event.target===modal)modal.style.display='none';}));
window.addEventListener('DOMContentLoaded',checkSession);

// Uses cached lists, so this UI helper does not hide another API exercise.
function openAddToListModal(recipeId) {
  if (!currentUser) { openModal('loginModal'); return; }
  if (cookLists.length === 0) { notify('Create or load a cook list first. Clear the list search to see all lists.'); return; }
  document.getElementById('targetRecipeId').value = recipeId;
  const select = document.getElementById('cookListSelect');
  select.replaceChildren();
  for (let i = 0; i < cookLists.length; i++) {
    const option = document.createElement('option');
    option.value = cookLists[i].name;
    option.textContent = cookLists[i].name;
    select.appendChild(option);
  }
  openModal('addToListModal');
}
